[pytest]
pythonpath = . backend
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    api: API endpoint unit and regression tests
    integration: Multi-service and pipeline integration tests
    security: RBAC and SQL guardrail security tests
    performance: Large dataset benchmarks and latency tests
    e2e: End-to-end browser and UI workflow tests
